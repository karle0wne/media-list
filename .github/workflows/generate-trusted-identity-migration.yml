name: generate trusted identity migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'refactor/trusted-identity-boundary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm install
      - name: Generate migration from exact schema
        run: npm run db:generate -- --name trusted_identity_boundary
      - name: Commit generated migration to PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          git add drizzle
          if git diff --cached --quiet; then
            echo 'no migration changes generated' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'db: migrate to trusted identity boundary'
          git push origin "HEAD:${HEAD_REF}"
