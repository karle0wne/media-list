name: generate schema snapshot

on:
  push:
    branches: [feat/fast-media-add]
    paths:
      - '.github/workflows/schema-generate.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm install
      - name: Generate canonical Drizzle migration
        run: |
          rm -rf drizzle/20260819013000_fast_media_add
          npx drizzle-kit generate --name fast_media_add
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add drizzle
          if git diff --cached --quiet; then
            echo 'No schema diff generated' >&2
            exit 1
          fi
          git commit -m 'db: generate fast media add migration'
          git push origin HEAD:${GITHUB_REF_NAME}
