name: container-smoke

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.label.name == 'smoke'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose and start production container
        env:
          APP_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          cp .env.example .env
          docker compose config >/dev/null
          APP_BIND=127.0.0.1 APP_PORT=3000 APP_REVISION="$APP_REVISION" docker compose up -d --build
          for _ in $(seq 1 60); do
            body="$(curl -fsS http://127.0.0.1:3000/api/health 2>/dev/null || true)"
            if [[ "$body" == *"\"ok\":true"* && "$body" == *"\"revision\":\"${APP_REVISION}\""* ]]; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Cleanup
        if: always()
        run: |
          docker compose down --remove-orphans || true
          sudo rm -rf data
          rm -f .env
