name: Generate Drizzle migration artifacts

on:
  push:
    branches:
      - ft/media-list-ops
    paths:
      - src/db/schema.ts
      - .github/workflows/bootstrap-drizzle.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Generate migration from schema changes
        run: npm run db:generate
      - uses: actions/upload-artifact@v4
        with:
          name: drizzle-generated
          path: drizzle
