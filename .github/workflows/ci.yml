name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  SOURCE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_REVISION }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: package.json
      - uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package.json') }}-
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_REVISION }}

      - name: Build immutable image
        run: |
          image="${IMAGE_NAME,,}:${SOURCE_REVISION}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${SOURCE_REVISION}" \
            -t "$image" .

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push immutable image
        run: docker push "$IMAGE"

      - name: Record immutable image digest
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')"
          test -n "$digest"
          printf '### Published image\n\n`%s@%s`\n' "${IMAGE%:*}" "$digest" >> "$GITHUB_STEP_SUMMARY"
          echo "Published ${IMAGE%:*}@$digest"
