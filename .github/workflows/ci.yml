name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: package.json
      - uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package.json') }}-
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v6

      - name: Build immutable image candidate
        run: |
          image="${IMAGE_NAME,,}:${GITHUB_SHA}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$image" .

      - name: Smoke exact image candidate
        env:
          APP_REVISION: ${{ github.sha }}
        run: |
          cp .env.example .env
          APP_IMAGE="$IMAGE" APP_BIND=127.0.0.1 APP_PORT=3000 APP_REVISION="$APP_REVISION" \
            docker compose up -d --no-build --pull never
          for _ in $(seq 1 60); do
            body="$(curl -fsS http://127.0.0.1:3000/api/health 2>/dev/null || true)"
            if [[ "$body" == *"\"ok\":true"* && "$body" == *"\"revision\":\"${APP_REVISION}\""* ]]; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push tested image
        run: docker push "$IMAGE"

      - name: Record immutable image digest
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')"
          test -n "$digest"
          printf '### Published image\n\n`%s@%s`\n' "${IMAGE%:*}" "$digest" >> "$GITHUB_STEP_SUMMARY"
          echo "Published ${IMAGE%:*}@$digest"

      - name: Cleanup
        if: always()
        run: |
          APP_IMAGE="${IMAGE:-media-list:local}" docker compose down --remove-orphans || true
          sudo rm -rf data
          rm -f .env
