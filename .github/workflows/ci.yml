name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and start production container
        env:
          APP_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cp .env.example .env
          docker compose config >/dev/null
          APP_BIND=127.0.0.1 APP_PORT=3000 APP_REVISION="$APP_REVISION" docker compose up -d --build
          for _ in $(seq 1 60); do
            body="$(curl -fsS http://127.0.0.1:3000/api/health 2>/dev/null || true)"
            if [[ "$body" == *"\"ok\":true"* && "$body" == *"\"revision\":\"${APP_REVISION}\""* ]]; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Cleanup
        if: always()
        run: |
          docker compose down --remove-orphans || true
          sudo rm -rf data
          rm -f .env
