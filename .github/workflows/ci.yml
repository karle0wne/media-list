name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref != 'diag/resolve-ui-image'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: package.json
      - uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package.json') }}-
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
      - name: Build immutable image
        run: |
          image="${IMAGE_NAME,,}:${GITHUB_SHA}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "$image" .
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push immutable image
        run: docker push "$IMAGE"
      - name: Record immutable image digest
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')"
          test -n "$digest"
          echo "Published ${IMAGE%:*}@$digest"
  resolve_image:
    if: github.event_name == 'pull_request' && github.head_ref == 'diag/resolve-ui-image'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR read-only
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Resolve immutable digest
        run: |
          image="ghcr.io/karle0wne/media-list:2a45a05fcea0422ecbbd19797a6f0b86cecc5191"
          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          test -n "$digest"
          echo "RESOLVED_IMAGE=ghcr.io/karle0wne/media-list@$digest"
