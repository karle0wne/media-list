name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SOURCE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_REVISION }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: package.json
      - uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package.json') }}-
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_PATH: /tmp/media-list-ui.db
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_REVISION }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: package.json
      - run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare deterministic UI database
        run: |
          rm -f "$DATABASE_PATH" "$DATABASE_PATH-wal" "$DATABASE_PATH-shm"
          npm run db:migrate
          npm run ui:fixture
      - run: npm run build
      - name: Exercise UI in Chromium
        run: npm run ui:proof
      - name: Summarize captured UI state
        if: always()
        run: |
          echo '### Chromium UI verification' >> "$GITHUB_STEP_SUMMARY"
          echo '- exact source revision: `'$SOURCE_REVISION'`' >> "$GITHUB_STEP_SUMMARY"
          if [ -d ui-proof ]; then
            find ui-proof -maxdepth 1 -type f -printf '%f\n' | sort | sed 's/^/- `/' | sed 's/$/`/' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '- no UI artifact directory was produced' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload UI state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-${{ env.SOURCE_REVISION }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ui-proof/
            playwright-report/
            test-results/

  publish:
    needs: [verify, ui]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_REVISION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.SOURCE_REVISION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_REVISION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable image digest
        run: |
          digest="${{ steps.image.outputs.digest }}"
          test -n "$digest"
          printf '### Published image\n\n`%s@%s`\n' "$IMAGE_NAME" "$digest" >> "$GITHUB_STEP_SUMMARY"
          echo "Published $IMAGE_NAME@$digest"
