name: published digest probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Print immutable digest
        run: |
          image="ghcr.io/${{ github.repository }}:623a4fb6afefd65786107fa90a052cf82be02f24"
          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          test -n "$digest"
          echo "PUBLISHED_IMAGE=${image%:*}@$digest"
