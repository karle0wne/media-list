services:
  app:
    image: ${APP_IMAGE:-media-list:local}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/media-list.db
      APP_REVISION: ${APP_REVISION:-dev}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      - ./data:/data
